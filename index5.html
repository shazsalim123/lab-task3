<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strawberry UI Lab 🍓 (Bootstrap Edition)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles5.css">
</head>
<body>

<!-- Hidden Checkbox for CSS-Only Theme Toggle -->
<input type="checkbox" id="theme-switch" class="d-none">

<!-- Main Wrapper (Changes variables when checkbox is ticked) -->
<div class="theme-wrapper min-vh-100 pb-5">
    
    <div class="container pt-4">
        
        <!-- Header -->
        <header class="d-flex justify-content-between align-items-center p-3 px-4 mb-5 rounded-pill shadow-sm custom-glass">
            <div class="d-flex align-items-center gap-2">
                <span class="fs-3">🍓</span>
                <h1 class="h4 m-0 fw-bold text-gradient">Strawberry Lab</h1>
            </div>
            
            <!-- Bootstrap Form Switch used as Theme Toggle -->
            <div class="form-check form-switch m-0 fs-5">
                <label class="form-check-label fw-bold text-muted" for="theme-switch" style="cursor: pointer;">
                    Night Mode
                </label>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="row g-4">
            
            <!-- CARD 1: Native Bootstrap Floating Labels & Controls -->
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow-sm rounded-4 custom-glass p-3">
                    <div class="card-body">
                        <h5 class="card-title fw-bold border-bottom border-primary border-2 pb-2 mb-4 d-inline-block">Input Testing</h5>
                        
                        <!-- Bootstrap Floating Label -->
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control rounded-4 border-secondary" id="magicalInput" placeholder="Magical Username">
                            <label for="magicalInput" class="text-muted">Magical Username</label>
                        </div>

                        <!-- Bootstrap Checkboxes -->
                        <div class="form-check mb-2">
                            <input class="form-check-input border-primary" type="checkbox" value="" id="checkSparkles" checked>
                            <label class="form-check-label" for="checkSparkles">✨ Enable Sparkles</label>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input border-primary" type="checkbox" value="" id="checkRibbons">
                            <label class="form-check-label" for="checkRibbons">🎀 Add Ribbons</label>
                        </div>

                        <!-- Bootstrap Range Slider -->
                        <label for="cuteRange" class="form-label fw-bold">Cuteness Overload Level:</label>
                        <input type="range" class="form-range" id="cuteRange">
                    </div>
                </div>
            </div>

            <!-- CARD 2: Bootstrap Buttons & Badges -->
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow-sm rounded-4 custom-glass p-3 position-relative overflow-hidden">
                    <!-- Bootstrap Badge -->
                    <span class="position-absolute top-0 end-0 bg-secondary text-white px-4 py-1 fw-bold shadow-sm" style="transform: rotate(45deg) translate(25px, -15px);">New!</span>
                    
                    <div class="card-body">
                        <h5 class="card-title fw-bold border-bottom border-primary border-2 pb-2 mb-4 d-inline-block">Action Center</h5>
                        <p class="card-text text-muted mb-4">Testing Bootstrap button variants and rounded utilities without custom CSS.</p>
                        
                        <div class="d-grid gap-3">
                            <button class="btn btn-primary rounded-pill fw-bold shadow-sm py-2">Primary Action 💖</button>
                            <button class="btn btn-outline-secondary rounded-pill fw-bold py-2">Secondary Action ☁️</button>
                            <button class="btn btn-danger rounded-pill fw-bold shadow-sm py-2">Danger Zone 🛑</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CARD 3: Native Bootstrap Animations -->
            <div class="col-md-12 col-lg-4">
                <div class="card h-100 border-0 shadow-sm rounded-4 custom-glass p-3">
                    <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">
                        <h5 class="card-title fw-bold border-bottom border-primary border-2 pb-2 mb-4 d-inline-block align-self-start">Animation Lab</h5>
                        
                        <!-- Bootstrap Spinners (Replacing custom keyframes) -->
                        <div class="d-flex gap-3 mb-5 mt-3">
                            <div class="spinner-grow text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="spinner-grow text-secondary" style="animation-delay: 0.2s;" role="status"></div>
                            <div class="spinner-grow text-primary" style="animation-delay: 0.4s;" role="status"></div>
                        </div>

                        <div class="d-flex gap-3 align-items-center">
                            <div class="spinner-border text-secondary" role="status"></div>
                            <span class="fw-bold text-muted">Processing Magic...</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
