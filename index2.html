<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Clone (Bootstrap Edition)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles2.css">
</head>
<body class="fb-bg">

<!-- Fixed Top Navigation -->
<nav class="navbar navbar-expand-lg bg-white fixed-top shadow-sm py-1">
    <div class="container-fluid px-3">
        
        <!-- Left: Logo & Search -->
        <div class="d-flex align-items-center" style="width: 320px;">
            <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center fs-3 fw-bold" style="width: 40px; height: 40px;">f</div>
            <input class="form-control ms-2 rounded-pill bg-light border-0" type="search" placeholder="Search Facebook" aria-label="Search">
        </div>

        <!-- Center: Nav Icons (Hidden on small screens) -->
        <div class="d-none d-md-flex justify-content-center flex-grow-1 gap-1">
            <button class="btn btn-white text-primary border-bottom border-primary border-3 rounded-0 px-4 fs-4" style="height: 50px;">🏠</button>
            <button class="btn btn-light bg-transparent rounded-3 px-4 fs-4 border-0" style="height: 50px;">📺</button>
            <button class="btn btn-light bg-transparent rounded-3 px-4 fs-4 border-0" style="height: 50px;">🏪</button>
            <button class="btn btn-light bg-transparent rounded-3 px-4 fs-4 border-0" style="height: 50px;">👥</button>
            <button class="btn btn-light bg-transparent rounded-3 px-4 fs-4 border-0" style="height: 50px;">🎮</button>
        </div>

        <!-- Right: Profile & Actions -->
        <div class="d-flex justify-content-end gap-2" style="width: 320px;">
            <button class="btn btn-light rounded-circle fw-bold p-0 d-flex justify-content-center align-items-center" style="width:40px; height:40px;">M</button>
            <button class="btn btn-light rounded-circle fw-bold p-0 d-flex justify-content-center align-items-center" style="width:40px; height:40px;">✉️</button>
            <button class="btn btn-light rounded-circle fw-bold p-0 d-flex justify-content-center align-items-center" style="width:40px; height:40px;">🔔</button>
            <button class="btn btn-secondary rounded-circle p-0" style="width:40px; height:40px;"></button>
        </div>
    </div>
</nav>

<!-- Main Layout Container -->
<div class="container-fluid mt-5 pt-4">
    <div class="row">
        
        <!-- Left Sidebar (Hidden on screens < 992px) -->
        <aside class="col-lg-3 col-xl-3 d-none d-lg-block sticky-sidebar pt-3">
            <div class="d-grid gap-1">
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-3 border-0 rounded-3 d-flex align-items-center gap-3">
                    <div class="bg-secondary rounded-circle" style="width:30px; height:30px;"></div> Your Profile
                </button>
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-3 border-0 rounded-3 d-flex align-items-center gap-3">
                    <div class="bg-primary rounded-circle" style="width:30px; height:30px;"></div> Friends
                </button>
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-3 border-0 rounded-3 d-flex align-items-center gap-3">
                    <div class="bg-info rounded-circle" style="width:30px; height:30px;"></div> Memories
                </button>
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-3 border-0 rounded-3 d-flex align-items-center gap-3">
                    <div class="bg-warning rounded-circle" style="width:30px; height:30px;"></div> Saved
                </button>
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-3 border-0 rounded-3 d-flex align-items-center gap-3">
                    <div class="bg-danger rounded-circle" style="width:30px; height:30px;"></div> Groups
                </button>
            </div>
        </aside>

        <!-- Center Feed -->
        <main class="col-12 col-lg-6 col-xl-6 px-lg-5 pt-3">
            <div class="mx-auto" style="max-width: 680px;">
                
                <!-- Create Post Card -->
                <div class="card border-0 shadow-sm rounded-3 mb-3">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <div class="bg-secondary rounded-circle flex-shrink-0" style="width: 40px; height: 40px;"></div>
                            <input class="form-control rounded-pill bg-light border-0 py-2" type="text" placeholder="What's on your mind?">
                        </div>
                        <hr class="text-muted">
                        <div class="d-flex justify-content-between">
                            <button class="btn btn-light bg-transparent text-muted fw-semibold border-0 flex-grow-1">🎥 Live Video</button>
                            <button class="btn btn-light bg-transparent text-muted fw-semibold border-0 flex-grow-1">🖼️ Photo/Video</button>
                            <button class="btn btn-light bg-transparent text-muted fw-semibold border-0 flex-grow-1">😊 Feeling/Activity</button>
                        </div>
                    </div>
                </div>

                <!-- Sample Post Card -->
                <div class="card border-0 shadow-sm rounded-3 mb-4">
                    <div class="card-body">
                        <!-- Post Header -->
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <div class="bg-secondary rounded-circle" style="width: 40px; height: 40px;"></div>
                            <div class="lh-1">
                                <h6 class="mb-1 fw-bold">Tech News</h6>
                                <small class="text-muted">2 hrs · 🌎</small>
                            </div>
                        </div>
                        <!-- Post Content -->
                        <p class="card-text mb-3">Just finished building a responsive UI clone using Bootstrap 5 grid and utility classes! It saved so much custom CSS writing.</p>
                        <!-- Post Stats -->
                        <div class="d-flex justify-content-between text-muted small mb-2">
                            <span>👍 ❤️ 124</span>
                            <span>12 Comments · 3 Shares</span>
                        </div>
                        <hr class="text-muted my-2">
                        <!-- Post Actions -->
                        <div class="d-flex justify-content-between">
                            <button class="btn btn-light bg-transparent text-muted fw-semibold border-0 flex-grow-1 py-2">👍 Like</button>
                            <button class="btn btn-light bg-transparent text-muted fw-semibold border-0 flex-grow-1 py-2">💬 Comment</button>
                            <button class="btn btn-light bg-transparent text-muted fw-semibold border-0 flex-grow-1 py-2">↗️ Share</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Right Sidebar (Hidden on screens < 1200px) -->
        <aside class="col-xl-3 d-none d-xl-block sticky-sidebar pt-3">
            <h6 class="text-muted fw-semibold mb-3">Sponsored</h6>
            <div class="d-flex align-items-center gap-3 mb-3 p-2 rounded-3 hover-bg-light" style="cursor: pointer;">
                <div class="bg-secondary rounded-3" style="width: 120px; height: 120px;"></div>
                <div>
                    <h6 class="mb-1 fw-bold">Learn Web Development</h6>
                    <small class="text-muted">example.com</small>
                </div>
            </div>
            
            <hr class="text-muted">
            
            <h6 class="text-muted fw-semibold mb-3">Contacts</h6>
            <div class="d-grid gap-1">
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-2 border-0 rounded-3 d-flex align-items-center gap-2">
                    <div class="bg-secondary rounded-circle" style="width:30px; height:30px;"></div> John Doe
                </button>
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-2 border-0 rounded-3 d-flex align-items-center gap-2">
                    <div class="bg-secondary rounded-circle" style="width:30px; height:30px;"></div> Jane Smith
                </button>
                <button class="btn btn-light bg-transparent text-start fw-semibold py-2 px-2 border-0 rounded-3 d-flex align-items-center gap-2">
                    <div class="bg-secondary rounded-circle" style="width:30px; height:30px;"></div> Alex Johnson
                </button>
            </div>
        </aside>

    </div>
</div>

</body>
</html>
